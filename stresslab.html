<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StressLab v1.0 | Materials Testing Workbench</title>
    <style>
        :root {
            --bg-primary: #09090e;
            --bg-surface: #12121c;
            --border-color: #242438;
            --accent-fail: #ff3344;
            --accent-yield: #ffaa00;
            --accent-elastic: #007acc;
            --text-main: #f0f0f5;
            --text-muted: #8a8a9e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
            max-width: 900px;
        }

        h1 {
            font-size: 26px;
            margin: 0 0 6px 0;
            background: linear-gradient(135deg, #fff 30%, var(--text-muted) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 11px;
            color: var(--text-muted);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 900px;
            width: 100%;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            box-sizing: border-box;
        }

        @media (max-width: 768px) {
            .dashboard { grid-template-columns: 1fr; }
        }

        .panel {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .window-label {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: -6px;
        }

        canvas {
            background-color: #030306;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            display: block;
            width: 100%;
            height: auto;
        }

        .control-panel {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .control-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        label { font-size: 13px; color: var(--text-main); }
        select {
            background-color: var(--bg-primary);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
        }

        button {
            padding: 10px 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            background-color: var(--accent-elastic);
            color: white;
            border: none;
            border-radius: 6px;
            transition: opacity 0.15s ease;
        }

        button:hover { opacity: 0.9; }
        button:disabled { background-color: var(--border-color); cursor: not-allowed; }

        .status-readout {
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            border-radius: 4px;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border-color);
            color: var(--accent-elastic);
        }
    </style>
</head>
<body>

    <header>
        <h1>StressLab // Universal Destructive Materials Testing</h1>
        <p class="subtitle">Stress-Strain Mechanics & Elongation Analysis Platform</p>
    </header>

    <div class="dashboard">
        <!-- Left Column: Physical Hydraulic Test Frame -->
        <div class="panel">
            <div class="window-label">Hydraulic Load Frame Visualization</div>
            <canvas id="specimenCanvas" width="400" height="350"></canvas>
            
            <div class="control-panel">
                <div class="control-group">
                    <label for="materialSelect">Alloy Profile:</label>
                    <select id="materialSelect">
                        <option value="steel">Structural Carbon Steel (1018)</option>
                        <option value="aluminum">Aerospace Aluminum (6061-T6)</option>
                        <option value="copper">Annealed Commercial Copper</option>
                    </select>
                </div>
                <button id="testBtn">Initiate Hydraulic Crosshead Pull</button>
                <div class="status-readout" id="statusBox">System Status: Awaiting Load Profiles...</div>
            </div>
        </div>

        <!-- Right Column: Real-time Plotting Analytics -->
        <div class="panel">
            <div class="window-label">Real-Time Data Analysis Plot (Stress vs Strain)</div>
            <canvas id="chartCanvas" width="400" height="350"></canvas>
        </div>
    </div>

    <script>
        const sCanvas = document.getElementById('specimenCanvas');
        const sCtx = sCanvas.getContext('2d');
        const cCanvas = document.getElementById('chartCanvas');
        const cCtx = cCanvas.getContext('2d');

        const materialSelect = document.getElementById('materialSelect');
        const testBtn = document.getElementById('testBtn');
        const statusBox = document.getElementById('statusBox');

        let animationId = null;
        let strain = 0;
        let isTesting = false;
        let dataPoints = [];

        // Engineering Constants Matrix Profiles
        const materials = {
            steel: { E: 200, yield: 250, ultimate: 400, fractureStrain: 0.25, name: 'Steel 1018' },
            aluminum: { E: 70, yield: 270, ultimate: 310, fractureStrain: 0.17, name: 'Al 6061-T6' },
            copper: { E: 110, yield: 70, ultimate: 220, fractureStrain: 0.40, name: 'Copper Annealed' }
        };

        function drawSetup() {
            // Render left structural assembly load columns
            sCtx.fillStyle = '#040407'; sCtx.fillRect(0,0,400,350);
            sCtx.fillStyle = '#222'; sCtx.fillRect(80, 20, 240, 20); sCtx.fillRect(80, 310, 240, 20);
            sCtx.fillStyle = '#444'; sCtx.fillRect(95, 40, 15, 270); sCtx.fillRect(290, 40, 15, 270);
            
            // Draw chart coordinates limits lines
            cCtx.fillStyle = '#040407'; cCtx.fillRect(0,0,400,350);
            cCtx.strokeStyle = '#222'; cCtx.lineWidth = 1;
            cCtx.beginPath(); cCtx.moveTo(50, 20); cCtx.lineTo(50, 310); cCtx.lineTo(380, 310); cCtx.stroke();
            
            cCtx.fillStyle = '#888899'; cCtx.font = '10px sans-serif';
            cCtx.fillText("Engineering Stress (MPa)", 10, 15);
            cCtx.fillText("Engineering Strain (ε)", 320, 325);
        }

        function calculateStress(strain, mat) {
            // Complete piecewise structural math tracking elastic and plastic flow regions
            if (strain < mat.yield / mat.E / 1000) {
                statusBox.style.color = '#007acc';
                statusBox.textContent = `Deformation Phase: Hooke's Elastic Domain`;
                return strain * mat.E * 1000;
            } else if (strain < mat.fractureStrain) {
                let eYield = mat.yield / mat.E / 1000;
                let pct = (strain - eYield) / (mat.fractureStrain - eYield);
                if (strain < mat.fractureStrain * 0.6) {
                    statusBox.style.color = '#ffaa00';
                    statusBox.textContent = `Deformation Phase: Plastic Yield Slip`;
                } else {
                    statusBox.style.color = '#ff5500';
                    statusBox.textContent = `Deformation Phase: Ultimate Tensile Necking`;
                }
                return mat.yield + (mat.ultimate - mat.yield) * Math.sin(pct * Math.PI * 0.85);
            } else {
                return 0; // Rupture threshold triggered
            }
        }

        function runSimulation() {
            const mat = materials[materialSelect.value];
            strain += 0.0012; // Controlled rate displacement loading increments
            let stress = calculateStress(strain, mat);

            // Re-render hydraulic crosshead displacement geometries
            sCtx.fillStyle = '#040407'; sCtx.fillRect(0,0,400,350);
            drawSetup();

            let stretch = strain * 120;
            let currentCrossheadY = 80 - stretch;

            // Render mechanical gripper assemblies
            sCtx.fillStyle = '#555';
            sCtx.fillRect(150, currentCrossheadY, 100, 30);
            sCtx.fillRect(150, 230, 100, 30);

            // Computational necking geometry profile calculation
            let baseWidth = 24;
            let currentWidth = baseWidth;
            if (stress > mat.yield) {
                let p = (strain - (mat.yield/mat.E/1000)) / mat.fractureStrain;
                currentWidth = baseWidth * (1 - p * 0.45);
            }

            // Draw physical gauge bar profile
            sCtx.fillStyle = stress === 0 ? '#333' : '#a8a8af';
            let barTop = currentCrossheadY + 30;
            let barBottom = 230;
            let barHeight = barBottom - barTop;

            if(stress > 0) {
                sCtx.beginPath();
                sCtx.moveTo(200 - baseWidth/2, barTop);
