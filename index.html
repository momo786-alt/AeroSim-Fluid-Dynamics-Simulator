<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroSim v1.0 | Discrete Fluid Dynamics Dashboard</title>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-surface: #12121a;
            --border-color: #222235;
            --accent-glow: #007acc;
            --accent-muted: #004477;
            --text-main: #f0f0f5;
            --text-muted: #888899;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin: 0 0 8px 0;
            background: linear-gradient(135deg, #fff 0%, var(--text-muted) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .app-container {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            max-width: 850px;
            width: 100%;
            box-sizing: border-box;
        }

        .canvas-wrapper {
            position: relative;
            background-color: #030305;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        canvas {
            display: block;
            cursor: crosshair;
        }

        .control-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }

        .telemetry {
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 12px;
            color: var(--text-muted);
            background: rgba(0,0,0,0.2);
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        button {
            padding: 10px 20px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        button:hover {
            background-color: #ffffff0a;
            border-color: var(--text-muted);
        }

        button:active {
            transform: scale(0.98);
        }

        footer {
            margin-top: 32px;
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }
        
        footer a {
            color: var(--accent-glow);
            text-decoration: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>AeroSim // Vector Dynamics Workbench</h1>
        <p class="subtitle">Computational Fluid Dynamics & Boundary Layer Simulation</p>
    </header>

    <div class="app-container">
        <div class="canvas-wrapper">
            <canvas id="simCanvas" width="800" height="400"></canvas>
        </div>

        <div class="control-bar">
            <div class="telemetry" id="telemetryData">System: Operational // Mouse: X: --- Y: ---</div>
            <button id="clearBtn">Reset Canvas Grid</button>
        </div>
    </div>

    <footer>
        Designed & Programmed independently for Admissions Portfolio Review
    </footer>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const telemetry = document.getElementById('telemetryData');
        let isDrawing = false;

        function initializeGrid() {
            // Draw background field
            ctx.fillStyle = '#040407';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw precise engineering structural grid lines
            ctx.strokeStyle = '#12121f';
            ctx.lineWidth = 1;
            
            for(let x = 0; x < canvas.width; x += 40) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for(let y = 0; y < canvas.height; y += 40) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }
        }

        // Mouse Tracing Architecture
        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            draw(e);
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = Math.round(e.clientX - rect.left);
            const y = Math.round(e.clientY - rect.top);
            
            // Output active engineering coordinates dynamically to screen tool
            if (x >= 0 && x <= canvas.width && y >= 0 && y <= canvas.height) {
                telemetry.textContent = `Boundary Layer Tracking // X: ${x}px Y: ${y}px`;
            }
            draw(e);
        });

        window.addEventListener('mouseup', () => {
            isDrawing = false;
            telemetry.textContent = `System: Operational // Mouse: Idle`;
        });

        function draw(e) {
            if (!isDrawing) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // Render solid geometric boundary boundary wall points
            ctx.fillStyle = '#007acc';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#007acc';
            ctx.beginPath();
            ctx.arc(x, y, 10, 0, Math.PI * 2);
            ctx.fill();
            
            // Reset shadow rules to protect system optimization paths
            ctx.shadowBlur = 0;
        }

        // Initialize execution sequences
        initializeGrid();
        document.getElementById('clearBtn').addEventListener('click', initializeGrid);
    </script>
</body>
</html>
