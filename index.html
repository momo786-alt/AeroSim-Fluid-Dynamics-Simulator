<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroSim v2.0 | Fluid Dynamics Workbench</title>
    <style>
        :root {
            --bg-primary: #08080c;
            --bg-surface: #111118;
            --border-color: #222235;
            --accent-glow: #00e678;
            --accent-blue: #007acc;
            --text-main: #f0f0f5;
            --text-muted: #888899;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
            max-width: 800px;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin: 0 0 6px 0;
            background: linear-gradient(135deg, #fff 30%, var(--text-muted) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .app-container {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            max-width: 840px;
            width: 100%;
            box-sizing: border-box;
        }

        .canvas-wrapper {
            position: relative;
            background-color: #020204;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            cursor: crosshair;
        }

        .control-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 12px;
        }

        .telemetry {
            font-family: monospace;
            font-size: 11px;
            color: var(--text-muted);
            background: rgba(0,0,0,0.3);
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            letter-spacing: 0.5px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            transition: all 0.15s ease;
        }

        button:hover {
            background-color: rgba(255,255,255,0.05);
            border-color: var(--text-muted);
        }

        button.danger:hover {
            background-color: rgba(230, 50, 50, 0.15);
            border-color: #e63232;
            color: #e63232;
        }

        footer {
            margin-top: 24px;
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <header>
        <h1>AeroSim v2.0 // Computational Fluid Dynamics</h1>
        <p class="subtitle">Vector Velocity Field & Boundary Streamline Simulator</p>
    </header>

    <div class="app-container">
        <div class="canvas-wrapper">
            <canvas id="simCanvas" width="800" height="400"></canvas>
        </div>

        <div class="control-bar">
            <div class="telemetry" id="telemetryData">Status: Streamlines Active // Fluid Mode: Laminar Flow</div>
            <div class="btn-group">
                <button id="clearBtn" class="danger">Clear Obstacles</button>
            </div>
        </div>
    </div>

    <footer>
        Designed & Programmed independently for US University Admissions Portfolio Review
    </footer>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const telemetry = document.getElementById('telemetryData');
        
        let isDrawing = false;
        
        const width = canvas.width;
        const height = canvas.height;

        // Use a grid downsampled by 4 to keep collision calculation bulletproof and highly performant
        const scale = 4;
        const gridW = Math.ceil(width / scale);
        const gridH = Math.ceil(height / scale);
        
        // Create 2D grid matrix mapping solid obstacles (1 = solid, 0 = fluid field)
        const grid = Array(gridW).fill().map(() => Array(gridH).fill(0));

        // Seed smooth aerodynamic particles
        const numParticles = 350;
        const particles = [];

        class StreamlineParticle {
            constructor(randomX = false) {
                this.reset();
                if (randomX) {
                    this.x = Math.random() * width;
                }
            }

            reset() {
                this.x = 0;
                this.y = Math.random() * height;
                this.vx = 3.5 + Math.random() * 1.0; // Uniform flow speed from left boundary
                this.vy = 0;
                this.age = 0;
                this.maxAge = 150 + Math.random() * 100;
            }

            update() {
                this.age++;
                
                // Fetch corresponding grid cell indices
                let gX = Math.floor(this.x / scale);
                let gY = Math.floor(this.y / scale);

                // Safe check within screen boundaries
                if (gX >= 0 && gX < gridW && gY >= 0 && gY < gridH) {
                    // Check if current or next position hits an obstacle boundary wall
                    if (grid[gX][gY] === 1) {
                        // Look up and down to find closest free fluid channel pathways
                        let upwardFree = -1;
                        let downwardFree = -1;

                        for (let d = 1; d < 30; d++) {
                            if (gY - d >= 0 && grid[gX][gY - d] === 0) {
                                upwardFree = d;
                                break;
                            }
                        }
                        for (let d = 1; d < 30; d++) {
                            if (gY + d < gridH && grid[gX][gY + d] === 0) {
                                downwardFree = d;
                                break;
                            }
                        }

                        // Route vector fluid acceleration away from obstacle boundary curves
                        if (upwardFree !== -1 && (downwardFree === -1 || upwardFree <= downwardFree)) {
                            this.vy = -2.2;
                        } else if (downwardFree !== -1) {
                            this.vy = 2.2;
                        } else {
                            this.reset();
                            return;
                        }
                    } else {
                        // Smoothly decay vertical component back towards laminar airflow profiles
                        this.vy *= 0.88;
                    }
                }

                // Advance kinematics parameters
                this.x += this.vx;
                this.y += this.vy;

                // Handle system wrap rules or absolute age exhaustion thresholds
                if (this.x > width || this.y < 0 || this.y > height || this.age > this.maxAge) {
                    this.reset();
                }
            }

            draw() {
                ctx.fillStyle = 'rgba(0, 230, 120, 0.6)';
                ctx.fillRect(this.x, this.y, 2, 2);
            }
        }

        // Initialize distributed system state arrays
        for (let i = 0; i < numParticles; i++) {
            particles.push(new StreamlineParticle(true));
        }

        // Main Animation Loop Execution Architecture
        function renderLoop() {
            // Apply frame trails to emphasize fluid velocity fields beautifully
            ctx.fillStyle = 'rgba(4, 4, 7, 0.12)';
            ctx.fillRect(0, 0, width, height);

            // Render precise vector structural layouts grid points
            ctx.fillStyle = 'rgba(30, 30, 50, 0.15)';
            for (let gx = 0; gx < gridW; gx += 10) {
                for (let gy = 0; gy < gridH; gy += 10) {
                    ctx.fillRect(gx * scale, gy * scale, 1, 1);
                }
            }

            // Draw user designed solid airfoils/obstacles surfaces
            ctx.fillStyle = 'rgba(0, 122, 204, 0.9)';
            for (let gx = 0; gx < gridW; gx++) {
                for (let gy = 0; gy < gridH; gy++) {
                    if (grid[gx][gy] === 1) {
                        ctx.fillRect(gx * scale, gy * scale, scale, scale);
                    }
                }
            }

            // Step active streamlines across simulation space
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(renderLoop);
        }

        // Mouse Drag Tracking Mechanisms
        function addObstacle(e) {
            const rect = canvas.getBoundingClientRect();
